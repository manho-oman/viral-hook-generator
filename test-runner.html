<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property-Based Test Runner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">🧪 Property-Based Test Runner</h1>
      <p class="text-gray-600">Testing Viral Hook Generator</p>
    </header>

    <div class="bg-white rounded-lg shadow-md p-6 mb-8">
      <button 
        id="run-tests-btn"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors"
      >
        Run All Property Tests
      </button>
    </div>

    <div id="test-output" class="bg-gray-900 text-green-400 font-mono text-sm p-6 rounded-lg overflow-auto max-h-96">
      <div>Click "Run All Property Tests" to begin...</div>
    </div>
  </div>

  <!-- Include script.js to get access to real app functions -->
  <script src="script.js"></script>

  <!-- Test wrapper - uses the REAL generate function logic -->
  <script>
    // Extract the core generation logic for testing
    function generateHooks(topic, niche = 'gaming') {
      const templates = HOOK_TEMPLATES[niche];
      
      // Use actual randomization like the real app
      const shuffled = [...templates].sort(() => Math.random() - 0.5);
      const selectedTemplates = shuffled.slice(0, Math.min(6, templates.length));
      
      // Fill templates exactly like the real app does
      const hooks = selectedTemplates.map(template => fillTemplate(template, topic));
      
      return hooks;
    }
  </script>

  <!-- Include the test file -->
  <script src="test-properties.js"></script>

  <!-- Test runner UI -->
  <script>
    // Capture console.log for display
    const output = document.getElementById('test-output');
    const originalLog = console.log;
    
    console.log = function(...args) {
      originalLog.apply(console, args);
      const message = args.map(arg => 
        typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
      ).join(' ');
      
      const div = document.createElement('div');
      div.textContent = message;
      output.appendChild(div);
      output.scrollTop = output.scrollHeight;
    };

    document.getElementById('run-tests-btn').addEventListener('click', function() {
      output.innerHTML = '<div>Running tests...</div>';
      setTimeout(() => {
        try {
          runAllPropertyTests();
        } catch (error) {
          console.log('❌ ERROR: ' + error.message);
          console.log('Stack: ' + error.stack);
        }
      }, 100);
    });
  </script>
</body>
</html>
