<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow">
    <h1 class="text-3xl font-bold mb-4">Hook Generator Test</h1>
    <input type="text" id="topic" placeholder="Enter topic" class="w-full p-3 border rounded mb-4">
    <button onclick="generate()" class="bg-blue-600 text-white px-6 py-3 rounded">Generate</button>
    <div id="output" class="mt-4"></div>
  </div>
  <script>
    function generate() {
      const topic = document.getElementById("topic").value;
      if (!topic) { alert("Enter a topic"); return; }
      const hooks = [
        "Hook 1 about " + topic,
        "Hook 2 about " + topic,
        "Hook 3 about " + topic
      ];
      document.getElementById("output").innerHTML = hooks.map((h, i) => 
        "<div class='bg-gray-50 p-4 mb-2 rounded'><b>Hook " + (i+1) + ":</b> " + h + "</div>"
      ).join("");
    }
  </script>
</body>
</html>
